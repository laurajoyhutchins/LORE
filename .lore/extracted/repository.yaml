extractor: repository-metadata
repository:
  id: lore
  languages:
    - JavaScript
    - Markdown
    - TypeScript
  name: LORE
  package_manager: pnpm
schema_version: 1
scripts:
  build: tsc -p tsconfig.json
  lint: eslint .
  lore: tsx src/cli/main.ts
  release:import-lock: node scripts/import-verified-lockfile.mjs
  release:refresh: node scripts/public-release-gate.mjs --refresh-generated
  release:verify: node scripts/public-release-gate.mjs
  test: vitest run
  test:watch: vitest
  typecheck: tsc -p tsconfig.json --noEmit

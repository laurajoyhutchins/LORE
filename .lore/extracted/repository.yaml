extractor: repository-metadata
repository:
  id: lore
  languages:
  - Markdown
  - TypeScript
  name: LORE
  package_manager: pnpm
schema_version: 1
scripts:
  build: tsc -p tsconfig.json
  lint: eslint .
  lore: tsx src/cli/main.ts
  test: vitest run
  test:watch: vitest
  typecheck: tsc -p tsconfig.json --noEmit

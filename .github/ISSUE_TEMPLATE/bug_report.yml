name: Bug report
description: Report reproducible incorrect behavior in LORE
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Follow SECURITY.md for private reporting.
  - type: input
    id: revision
    attributes:
      label: LORE revision
      description: Commit SHA, tag, or version where the problem occurs.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the command and smallest reproducible repository input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Which documented behavior or invariant should have held?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js, Corepack, pnpm, and Git versions.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Include bounded logs or error output after removing secrets and private repository data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this behavior.
          required: true
        - label: This report does not contain credentials, private source, or vulnerability details.
          required: true

name: Bootstrap archaeology payload

on:
  push:
    branches:
      - archaeology/deciduous-causal-backfill
    paths:
      - '.github/archaeology-payload.part-*'
      - '.github/workflows/bootstrap-archaeology.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/archaeology-payload.part-*'
      - '.github/workflows/bootstrap-archaeology.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-archaeology-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: archaeology/deciduous-causal-backfill
          fetch-depth: 0
      - name: Materialize and verify archaeology
        shell: bash
        run: |
          set -euo pipefail
          cat .github/archaeology-payload.part-* > /tmp/archaeology-payload.b64
          base64 --decode /tmp/archaeology-payload.b64 > /tmp/archaeology-payload.tar.gz
          echo '7e542d5c4abfd13d09c97ffa9b99f7ff89d1535a6fabb3077fb538f12cbd926c  /tmp/archaeology-payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/archaeology-payload.tar.gz -C .
          rm -f .github/archaeology-payload.part-* .github/workflows/bootstrap-archaeology.yml
          python scripts/generate_archaeology.py
          python scripts/validate_archaeology.py
          python -m unittest discover -s tests -p 'test_archaeology.py' -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: complete Deciduous archaeology backfill'
          git push origin HEAD:archaeology/deciduous-causal-backfill

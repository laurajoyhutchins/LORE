name: Materialize causal projections

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 20 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Implement native causal projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          causal = '''import { recordReference } from "../domain/references.js";
          import type { RelationshipPayload, SemanticRecord, ValidatedRepository } from "../domain/types.js";

          const marker = "<!-- Generated by LORE. Do not edit directly. -->";

          function active(repository: ValidatedRepository, record: SemanticRecord): boolean {
            return repository.effectiveStatus.get(recordReference(repository.manifest.repository.id, record)) !== "superseded";
          }

          function payload(record: SemanticRecord): RelationshipPayload {
            return record.payload as unknown as RelationshipPayload;
          }

          function activeRelationships(repository: ValidatedRepository): SemanticRecord[] {
            return repository.records
              .filter((record) => record.kind === "relationship" && active(repository, record))
              .sort((left, right) => left.id.localeCompare(right.id));
          }

          export function renderWhyThisRepository(repository: ValidatedRepository): string {
            const byReference = new Map(
              repository.records.map((record) => [
                recordReference(repository.manifest.repository.id, record),
                record,
              ]),
            );
            const relationships = activeRelationships(repository);
            if (relationships.length === 0) {
              return `${marker}\\n# Why this repository\\n\\nNo accepted causal relationships are recorded yet.\\n`;
            }
            const grouped = new Map<string, SemanticRecord[]>();
            for (const relationship of relationships) {
              const edge = payload(relationship);
              const incoming = grouped.get(edge.to) ?? [];
              incoming.push(relationship);
              grouped.set(edge.to, incoming);
            }
            const sections = [...grouped.entries()]
              .sort(([left], [right]) => left.localeCompare(right))
              .map(([targetReference, incoming]) => {
                const target = byReference.get(targetReference);
                const lines = incoming
                  .sort((left, right) => left.id.localeCompare(right.id))
                  .map((relationship) => {
                    const edge = payload(relationship);
                    const source = byReference.get(edge.from);
                    const evidence = relationship.evidence
                      .map(({ path, revision }) => `\\`${path}\\` at \\`${revision}\\``)
                      .join(", ");
                    return `- **${edge.relation}** from ${source?.title ?? edge.from}: ${edge.rationale} Evidence: ${evidence}.`;
                  })
                  .join("\\n");
                return `## ${target?.title ?? targetReference}\\n\\n${target?.summary ?? targetReference}\\n\\n${lines}`;
              })
              .join("\\n\\n");
            return `${marker}\\n# Why this repository\\n\\nThis view is generated from accepted LORE relationship records. It is explanatory and non-authoritative.\\n\\n${sections}\\n`;
          }

          export function renderDeciduousCompatibility(repository: ValidatedRepository): string {
            const nodes = repository.records
              .filter((record) => record.kind !== "relationship" && active(repository, record))
              .sort((left, right) =>
                recordReference(repository.manifest.repository.id, left).localeCompare(
                  recordReference(repository.manifest.repository.id, right),
                ),
              )
              .map((record) => {
                const reference = recordReference(repository.manifest.repository.id, record);
                return {
                  id: reference,
                  type: record.kind,
                  status: repository.effectiveStatus.get(reference) ?? record.status,
                  title: record.title,
                  description: record.summary,
                  evidence: record.evidence.map(({ revision, path }) => ({ revision, path })),
                };
              });
            const edges = activeRelationships(repository).map((relationship) => {
              const edge = payload(relationship);
              return {
                id: recordReference(repository.manifest.repository.id, relationship),
                from: edge.from,
                to: edge.to,
                type: edge.relation,
                rationale: edge.rationale,
                evidence: relationship.evidence.map(({ revision, path }) => ({ revision, path })),
              };
            });
            return `${JSON.stringify(
              {
                schema: "lore-deciduous-compat/v1",
                repository: repository.manifest.repository.id,
                nodes,
                edges,
              },
              null,
              2,
            )}\\n`;
          }
          '''
          Path("src/projection/causal.ts").write_text(causal, encoding="utf-8")

          types = Path("src/domain/types.ts")
          text = types.read_text()
          old = "|'data-model-reference';"
          new = "|'data-model-reference'|'why-this-repository'|'deciduous-compat';"
          assert old in text
          types.write_text(text.replace(old, new, 1))

          manifest = Path("schemas/manifest.schema.json")
          text = manifest.read_text()
          old = '              "data-model-reference"\n'
          new = '              "data-model-reference",\n              "why-this-repository",\n              "deciduous-compat"\n'
          assert old in text
          manifest.write_text(text.replace(old, new, 1))

          lore = Path("lore.yaml")
          text = lore.read_text()
          old = "- id: data-model-reference\n  output: docs/generated/reference/data-model.md\n"
          new = old + "- id: why-this-repository\n  output: docs/generated/why-this-repository.md\n- id: deciduous-compat\n  output: docs/generated/compatibility/deciduous.json\n"
          assert old in text
          lore.write_text(text.replace(old, new, 1))

          project = Path("src/projection/project.ts")
          text = project.read_text()
          import_anchor = 'import {\n  renderArchitecture,'
          assert import_anchor in text
          text = text.replace(
            import_anchor,
            'import { renderDeciduousCompatibility, renderWhyThisRepository } from "./causal.js";\n' + import_anchor,
            1,
          )
          map_anchor = '      "data-model-reference": renderDataModelReference,\n'
          assert map_anchor in text
          text = text.replace(
            map_anchor,
            map_anchor + '      "why-this-repository": renderWhyThisRepository,\n      "deciduous-compat": renderDeciduousCompatibility,\n',
            1,
          )
          project.write_text(text)

          templates = Path("src/projection/templates.ts")
          text = templates.read_text()
          export_line = '\nexport { renderDeciduousCompatibility, renderWhyThisRepository } from "./causal.js";\n'
          if export_line.strip() not in text:
            templates.write_text(text.rstrip() + export_line)

          templates = Path("src/projection/templates.ts")
          text = templates.read_text()
          docs_anchor = "- [Data model reference](docs/generated/reference/data-model.md)\n"
          assert docs_anchor in text
          text = text.replace(
            docs_anchor,
            docs_anchor + "- [Why this repository](docs/generated/why-this-repository.md)\n- [Deciduous compatibility projection](docs/generated/compatibility/deciduous.json)\n",
            1,
          )
          templates.write_text(text)

          test = '''import { expect, it } from "vitest";
          import type { SemanticRecord, ValidatedRepository } from "../../../src/domain/types.js";
          import { renderDeciduousCompatibility, renderWhyThisRepository } from "../../../src/projection/templates.js";

          const revision = "0123456789abcdef0123456789abcdef01234567";
          function record(kind: SemanticRecord["kind"], id: string, title: string): SemanticRecord {
            return {
              schema_version: 1,
              id,
              kind,
              revision: 1,
              status: "active",
              title,
              summary: `${title} summary.`,
              scope: { repository: "example", components: [] },
              evidence: [{ revision, path: "docs/design.md" }],
              disclosure: { audiences: ["maintainer"], tags: [kind], weight: 90 },
              provenance: { source: "bootstrap", transaction: null, producer: "human-reviewed" },
              supersedes: null,
              payload: {},
            };
          }

          it("projects accepted causality as human explanation and Deciduous-compatible JSON", () => {
            const source = record("finding", "finding.observed", "Observed failure");
            const target = record("decision", "decision.fix", "Adopt the fix");
            const edge = record("relationship", "relationship.observed-to-fix", "Observed failure led to fix");
            const sourceRef = "lore://example/finding/finding.observed@1";
            const targetRef = "lore://example/decision/decision.fix@1";
            edge.payload = {
              from: sourceRef,
              to: targetRef,
              relation: "leads_to",
              rationale: "The observed failure required a safer design.",
            };
            const repository: ValidatedRepository = {
              root: ".",
              revision,
              records: [source, target, edge],
              effectiveStatus: new Map(),
              extracted: {},
              manifest: {
                schema_version: 1,
                repository: { id: "example", name: "Example", root: "." },
                paths: { extracted: ".lore/extracted", records: ".lore/records", proposals: ".lore/proposals", transactions: ".lore/transactions", generated_docs: "docs/generated", skills: "skills" },
                extractors: [],
                projections: [],
                maintenance: { skill: "skills/maintain-repository-documentation/SKILL.md", proposal_schema: "schemas/proposal.schema.json" },
                hydration: { max_records: 20, max_characters: 40000 },
              },
            };
            expect(renderWhyThisRepository(repository)).toContain("The observed failure required a safer design.");
            const compat = JSON.parse(renderDeciduousCompatibility(repository));
            expect(compat.schema).toBe("lore-deciduous-compat/v1");
            expect(compat.edges).toContainEqual(expect.objectContaining({ from: sourceRef, to: targetRef, type: "leads_to" }));
          });
          '''
          Path("tests/unit/projection/causal-projections.test.ts").write_text(test, encoding="utf-8")
          PY
      - run: node scripts/public-release-gate.mjs --refresh-generated
      - name: Commit implementation and LORE-generated state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-causal-projections.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: project native causal history"
          node scripts/public-release-gate.mjs
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Commit relationships refresh

on:
  push:
    branches: [feat/versioned-cli-release]
    paths:
      - .github/workflows/commit-relationships-refresh.yml

permissions:
  contents: write

concurrency:
  group: commit-relationships-refresh
  cancel-in-progress: false

jobs:
  commit:
    if: ${{ github.repository == 'laurajoyhutchins/LORE' && github.ref == 'refs/heads/feat/versioned-cli-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: 48c8a4ecb55bcf3dff035b3f271633b55a88fcc6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/versioned-cli-release
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Verify one-shot authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^1^{commit}')" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "feat/versioned-cli-release"
      - name: Refresh and verify extracted relationships
        shell: bash
        run: |
          set -euo pipefail
          node scripts/restore-verified-lockfile.mjs
          corepack pnpm install --frozen-lockfile
          corepack pnpm lore extract
          corepack pnpm lore extract --check
          rm pnpm-lock.yaml
      - name: Commit only the refreshed relationship index
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/commit-relationships-refresh.yml
          git diff --check
          git add .lore/extracted/relationships.yaml
          ACTUAL="$(git status --short | sed 's/^...//' | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/commit-relationships-refresh.yml' \
            '.lore/extracted/relationships.yaml' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh extracted import relationships'
          git push origin HEAD:feat/versioned-cli-release

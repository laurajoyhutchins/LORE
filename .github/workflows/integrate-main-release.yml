name: Diagnose versioned release integration

on:
  push:
    branches: [feat/versioned-cli-release]
    paths:
      - .github/workflows/integrate-main-release.yml

permissions:
  contents: write

concurrency:
  group: diagnose-versioned-release-integration
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.repository == 'laurajoyhutchins/LORE' && github.ref == 'refs/heads/feat/versioned-cli-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: abe41fa0f68a38a97fc4edfe2f88f50a1a2cf248
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/versioned-cli-release
          fetch-depth: 0
          persist-credentials: true
      - name: Capture merge diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^1^{commit}')" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main >merge.stdout 2>merge.stderr
          merge_status=$?
          set -e
          {
            echo "head=$(git rev-parse HEAD)"
            echo "main=$(git rev-parse origin/main)"
            echo "merge_exit=$merge_status"
            echo "unmerged_begin"
            git diff --name-only --diff-filter=U | sort
            echo "unmerged_end"
            echo "status_begin"
            git status --short
            echo "status_end"
            echo "stdout_begin"
            cat merge.stdout
            echo "stdout_end"
            echo "stderr_begin"
            cat merge.stderr
            echo "stderr_end"
          } > /tmp/release-integration-diagnostic.txt
          git merge --abort >/dev/null 2>&1 || true
          rm -f merge.stdout merge.stderr
          cp /tmp/release-integration-diagnostic.txt .github/release-integration-diagnostic.txt
          git add .github/release-integration-diagnostic.txt
          git commit -m 'ci: refresh release integration diagnostics'
          git push origin HEAD:feat/versioned-cli-release

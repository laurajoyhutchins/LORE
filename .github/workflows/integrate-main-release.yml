name: Integrate main into versioned release

on:
  push:
    branches: [feat/versioned-cli-release]
    paths:
      - .github/workflows/integrate-main-release.yml

permissions:
  contents: write

concurrency:
  group: integrate-main-release
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ github.repository == 'laurajoyhutchins/LORE' && github.ref == 'refs/heads/feat/versioned-cli-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: d80043bc9af35adb46608af1b5ca0ba848e64758
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/versioned-cli-release
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Merge current main without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          echo merge > /tmp/integration-phase
          test "$(git rev-parse 'HEAD^1^{commit}')" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          test "$merge_status" -eq 1
          test "$(git diff --name-only --diff-filter=U)" = ".lore/extracted/repository.yaml"
          git checkout --ours -- .lore/extracted/repository.yaml
          git checkout --ours -- .github/workflows/ci.yml
          git add .lore/extracted/repository.yaml .github/workflows/ci.yml

          grep -Fq 'extraction.value.obsoleteFiles' src/cli/main.ts
          grep -Fq 'projects candidate effective statuses when planning a transaction' tests/invariants/remediation-contracts.test.ts
          grep -Fq 'exact-head and proposed-merge verification' tests/release/release-workflow.test.mjs
      - name: Regenerate and verify integrated source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/integration-verify.log) 2>&1
          phase() { echo "$1" > /tmp/integration-phase; }
          phase restore-lock
          node scripts/restore-verified-lockfile.mjs
          phase install
          corepack pnpm install --frozen-lockfile
          phase extract
          corepack pnpm lore extract
          phase project
          corepack pnpm lore project
          phase typecheck
          corepack pnpm typecheck
          phase lint
          corepack pnpm lint
          phase test
          corepack pnpm test
          phase build
          corepack pnpm build
          phase extract-check
          corepack pnpm lore extract --check
          phase validate
          corepack pnpm lore validate
          phase project-check
          corepack pnpm lore project --check
          phase verify-self
          corepack pnpm lore verify-self
          phase cleanup
          rm pnpm-lock.yaml
          git add -A
          git diff --check --cached
          test -z "$(git diff --cached --name-only "$GITHUB_SHA" -- .github/workflows)"
      - name: Commit integrated release head
        shell: bash
        run: |
          set -euo pipefail
          echo commit > /tmp/integration-phase
          git commit -m 'Merge main consumer fixes into versioned CLI release'
      - name: Run complete publication gate
        shell: bash
        run: |
          set -euo pipefail
          echo publication-gate > /tmp/integration-phase
          node scripts/public-release-gate.mjs
      - name: Push verified merge commit
        shell: bash
        run: |
          set -euo pipefail
          echo push > /tmp/integration-phase
          git push origin HEAD:feat/versioned-cli-release
      - name: Record failure phase
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          phase="$(cat /tmp/integration-phase 2>/dev/null || echo unknown)"
          status="$(git status --short || true)"
          local_head="$(git rev-parse HEAD)"
          log_tail="$(tail -n 260 /tmp/integration-verify.log 2>/dev/null || true)"
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          {
            echo "phase=$phase"
            echo "workflow_sha=$GITHUB_SHA"
            echo "local_head_before_reset=$local_head"
            echo "status_before_reset_begin"
            printf '%s\n' "$status"
            echo "status_before_reset_end"
            echo "verify_log_tail_begin"
            printf '%s\n' "$log_tail"
            echo "verify_log_tail_end"
          } > .github/release-integration-failure.txt
          git add .github/release-integration-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: record release integration failure'
          git push origin HEAD:feat/versioned-cli-release

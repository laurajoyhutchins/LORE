name: Integrate main into versioned release

on:
  push:
    branches: [feat/versioned-cli-release]
    paths:
      - .github/workflows/integrate-main-release.yml

permissions:
  contents: write

concurrency:
  group: integrate-main-release
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ github.repository == 'laurajoyhutchins/LORE' && github.ref == 'refs/heads/feat/versioned-cli-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: 2a1247964847a6e284fe955bace8789c02bb875c
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/versioned-cli-release
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          echo merge > /tmp/integration-phase
          test "$(git rev-parse 'HEAD^1^{commit}')" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "feat/versioned-cli-release"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          test "$merge_status" -eq 1
          test "$(git diff --name-only --diff-filter=U)" = ".lore/extracted/repository.yaml"
          git checkout --ours -- .lore/extracted/repository.yaml
          git add .lore/extracted/repository.yaml

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify-head:
              name: Verify exact head
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v6
                  with:
                    repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
                    ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: false
                - uses: actions/setup-node@v6
                  with:
                    node-version: 22.14.0
                    package-manager-cache: false
                - run: node scripts/public-release-gate.mjs

            verify-merge:
              name: Verify proposed merge
              if: github.event_name == 'pull_request'
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v6
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - uses: actions/setup-node@v6
                  with:
                    node-version: 22.14.0
                    package-manager-cache: false
                - run: node scripts/public-release-gate.mjs
          YAML
          git add .github/workflows/ci.yml

          grep -Fq 'extraction.value.obsoleteFiles' src/cli/main.ts
          grep -Fq 'projects candidate effective statuses when planning a transaction' tests/invariants/remediation-contracts.test.ts
          ! grep -Fq 'does not plan a transaction before candidate evidence is validated' tests/invariants/remediation-contracts.test.ts

          git rm .github/release-integration-diagnostic.txt
          git rm .github/workflows/diagnose-release-sync.yml
          git rm .github/workflows/integrate-main-release.yml
      - name: Regenerate and verify integrated source
        shell: bash
        run: |
          set -euo pipefail
          echo verify > /tmp/integration-phase
          node scripts/restore-verified-lockfile.mjs
          corepack pnpm install --frozen-lockfile
          corepack pnpm lore extract
          corepack pnpm lore project
          corepack pnpm typecheck
          corepack pnpm lint
          corepack pnpm test
          corepack pnpm build
          corepack pnpm lore extract --check
          corepack pnpm lore validate
          corepack pnpm lore project --check
          corepack pnpm lore verify-self
          rm pnpm-lock.yaml
          git add -A
          git diff --check --cached
      - name: Commit integrated release head
        shell: bash
        run: |
          set -euo pipefail
          echo commit > /tmp/integration-phase
          git commit -m 'Merge main consumer fixes into versioned CLI release'
      - name: Run complete publication gate
        shell: bash
        run: |
          set -euo pipefail
          echo publication-gate > /tmp/integration-phase
          node scripts/public-release-gate.mjs
      - name: Push verified merge commit
        shell: bash
        run: |
          set -euo pipefail
          echo push > /tmp/integration-phase
          git push origin HEAD:feat/versioned-cli-release
      - name: Record failure phase
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          phase="$(cat /tmp/integration-phase 2>/dev/null || echo unknown)"
          status="$(git status --short || true)"
          local_head="$(git rev-parse HEAD)"
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          {
            echo "phase=$phase"
            echo "workflow_sha=$GITHUB_SHA"
            echo "local_head_before_reset=$local_head"
            echo "status_before_reset_begin"
            printf '%s\n' "$status"
            echo "status_before_reset_end"
          } > .github/release-integration-failure.txt
          git add .github/release-integration-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: record release integration failure'
          git push origin HEAD:feat/versioned-cli-release

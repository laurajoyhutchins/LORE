name: Materialize explain why

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 21 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Wire causal explanation through the CLI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/cli/main.ts")
          s = p.read_text()
          if 'why: { type: "boolean" }' not in s:
              s = s.replace('        json: { type: "boolean" },\n', '        json: { type: "boolean" },\n        why: { type: "boolean" },\n', 1)
          old = '      const result = explainRecord(args.value[0] as string, repository.value, receipts);\n'
          new = '      const result = explainRecord(\n        args.value[0] as string,\n        repository.value,\n        receipts,\n        parsed.values.why === true,\n      );\n'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("src/projection/templates.ts")
          s = p.read_text()
          old = '["explain", "`lore explain <record-ref> [--json]`", "Explain a record, its effective status, lineage, relationships, evidence, and transactions."],'
          new = '["explain", "`lore explain <record-ref> [--why] [--json]`", "Explain a record, its effective status, lineage, evidence, transactions, and optionally its accepted causal ancestors."],'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit CLI implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli/main.ts src/projection/templates.ts
          git diff --cached --check
          git commit -m "feat: expose causal history through explain --why"
      - run: node scripts/public-release-gate.mjs --refresh-generated
      - name: Commit generated state and remove harness
        run: |
          rm .github/workflows/materialize-explain-why.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: reconcile explain why generated state"
          node scripts/public-release-gate.mjs
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Commit graph-neutral CLI entrypoint fix

on:
  push:
    branches: [feat/versioned-cli-release]
    paths:
      - .github/workflows/commit-entrypoint-final.yml

permissions:
  contents: write

concurrency:
  group: commit-entrypoint-final
  cancel-in-progress: false

jobs:
  commit:
    if: ${{ github.repository == 'laurajoyhutchins/LORE' && github.ref == 'refs/heads/feat/versioned-cli-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: cefb7b92b1e0ea965e93e7b6f31e9c7c729776af
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/versioned-cli-release
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Verify one-shot authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^1^{commit}')" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "feat/versioned-cli-release"
      - name: Patch entrypoint resolution without changing the extraction graph
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          metadata = Path('src/release/metadata.ts')
          text = metadata.read_text()
          old = '''import { readFile } from "node:fs/promises";
          '''
          new = '''import { readFile, realpath } from "node:fs/promises";
          '''
          if text.count(old) != 1:
              raise SystemExit('METADATA_IMPORT_ANCHOR_INVALID')
          text = text.replace(old, new)
          old = '''interface PackageIdentity {
            name: string;
            version: string;
          }

          export async function createVersionInfo(): Promise<LoreVersionInfo> {
          '''
          new = '''interface PackageIdentity {
            name: string;
            version: string;
          }

          type RealpathResolver = (candidate: string) => string | Promise<string>;

          async function resolveCliEntryPoint(
            modulePath: string,
            executablePath: string | undefined,
            canonicalizePath: RealpathResolver = realpath,
          ): Promise<boolean> {
            if (executablePath === undefined) return false;
            try {
              return (
                (await canonicalizePath(modulePath)) ===
                (await canonicalizePath(executablePath))
              );
            } catch {
              return false;
            }
          }

          export { resolveCliEntryPoint };

          export async function createVersionInfo(): Promise<LoreVersionInfo> {
          '''
          if text.count(old) != 1:
              raise SystemExit('METADATA_BODY_ANCHOR_INVALID')
          metadata.write_text(text.replace(old, new))

          main = Path('src/cli/main.ts')
          text = main.read_text()
          changes = [
              ('import { realpathSync } from "node:fs";\n', ''),
              ('import { fileURLToPath, pathToFileURL } from "node:url";', 'import { fileURLToPath } from "node:url";'),
              ('import { createVersionInfo } from "../release/metadata.js";', 'import { createVersionInfo, resolveCliEntryPoint } from "../release/metadata.js";'),
          ]
          for old, new in changes:
              if text.count(old) != 1:
                  raise SystemExit(f'MAIN_IMPORT_ANCHOR_INVALID: {old}')
              text = text.replace(old, new)
          old = '''export function isCliEntryPoint(
            moduleUrl: string,
            executablePath: string | undefined,
            canonicalizePath: (candidate: string) => string = realpathSync,
          ): boolean {
            if (executablePath === undefined) return false;
            const modulePath = fileURLToPath(moduleUrl);
            try {
              return canonicalizePath(modulePath) === canonicalizePath(executablePath);
            } catch {
              return moduleUrl === pathToFileURL(executablePath).href;
            }
          }
          '''
          new = '''export async function isCliEntryPoint(
            modulePath: string,
            executablePath: string | undefined,
            canonicalizePath?: (candidate: string) => string | Promise<string>,
          ): Promise<boolean> {
            return resolveCliEntryPoint(
              modulePath,
              executablePath,
              canonicalizePath,
            );
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('MAIN_FUNCTION_ANCHOR_INVALID')
          text = text.replace(old, new)
          old = '''if (isCliEntryPoint(import.meta.url, process.argv[1])) {
            process.exitCode = await runCli(process.argv.slice(2));
          }'''
          new = '''if (
            await isCliEntryPoint(fileURLToPath(import.meta.url), process.argv[1])
          ) {
            process.exitCode = await runCli(process.argv.slice(2));
          }'''
          if text.count(old) != 1:
              raise SystemExit('MAIN_ENTRY_ANCHOR_INVALID')
          main.write_text(text.replace(old, new))

          test = Path('tests/unit/cli/main.test.ts')
          text = test.read_text()
          old = '''it("detects the executable entrypoint through a platform-safe file URL", () => {
            const executablePath = path.resolve("dist/cli/main.js");
            const moduleUrl = pathToFileURL(executablePath).href;
            expect(isCliEntryPoint(moduleUrl, executablePath)).toBe(true);
            expect(isCliEntryPoint(moduleUrl, undefined)).toBe(false);
            expect(isCliEntryPoint(moduleUrl, path.resolve("dist/cli/other.js"))).toBe(
              false,
            );
          });'''
          new = '''it("detects the executable entrypoint through a platform-safe file URL", async () => {
            const executablePath = path.resolve("dist/cli/main.js");
            expect(pathToFileURL(executablePath).protocol).toBe("file:");
            const canonicalize = async (candidate: string) => candidate;
            await expect(
              isCliEntryPoint(executablePath, executablePath, canonicalize),
            ).resolves.toBe(true);
            await expect(
              isCliEntryPoint(executablePath, undefined, canonicalize),
            ).resolves.toBe(false);
            await expect(
              isCliEntryPoint(
                executablePath,
                path.resolve("dist/cli/other.js"),
                canonicalize,
              ),
            ).resolves.toBe(false);
          });'''
          if text.count(old) != 1:
              raise SystemExit('TEST_PLATFORM_ANCHOR_INVALID')
          text = text.replace(old, new)
          old = '''it("detects a package entrypoint invoked through a bin symlink", () => {
            const modulePath = path.resolve(
              "node_modules/@laurajoyhutchins/lore/dist/cli/main.js",
            );
            const executablePath = path.resolve("node_modules/.bin/lore");
            const canonicalize = vi.fn((candidate: string) =>
              candidate === executablePath ? modulePath : candidate,
            );

            expect(
              isCliEntryPoint(pathToFileURL(modulePath).href, executablePath, canonicalize),
            ).toBe(true);
            expect(canonicalize).toHaveBeenCalledWith(modulePath);
            expect(canonicalize).toHaveBeenCalledWith(executablePath);
          });'''
          new = '''it("detects a package entrypoint invoked through a bin symlink", async () => {
            const modulePath = path.resolve(
              "node_modules/@laurajoyhutchins/lore/dist/cli/main.js",
            );
            const executablePath = path.resolve("node_modules/.bin/lore");
            const canonicalize = vi.fn((candidate: string) =>
              candidate === executablePath ? modulePath : candidate,
            );

            await expect(
              isCliEntryPoint(modulePath, executablePath, canonicalize),
            ).resolves.toBe(true);
            expect(canonicalize).toHaveBeenCalledWith(modulePath);
            expect(canonicalize).toHaveBeenCalledWith(executablePath);
          });'''
          if text.count(old) != 1:
              raise SystemExit('TEST_SYMLINK_ANCHOR_INVALID')
          test.write_text(text.replace(old, new))
          PY
      - name: Verify source and unchanged generated state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/restore-verified-lockfile.mjs
          corepack pnpm install --frozen-lockfile
          corepack pnpm typecheck
          corepack pnpm lint
          corepack pnpm test
          corepack pnpm build
          corepack pnpm lore extract --check
          corepack pnpm lore project --check
          rm pnpm-lock.yaml
      - name: Commit only the verified source change
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/commit-entrypoint-final.yml
          git diff --check
          git add src/release/metadata.ts src/cli/main.ts tests/unit/cli/main.test.ts
          ACTUAL="$(git status --short | sed 's/^...//' | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/commit-entrypoint-final.yml' \
            'src/cli/main.ts' \
            'src/release/metadata.ts' \
            'tests/unit/cli/main.test.ts' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve installed CLI entrypoint without graph drift'
          git push origin HEAD:feat/versioned-cli-release

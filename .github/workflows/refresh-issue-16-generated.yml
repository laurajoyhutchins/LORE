name: Refresh issue 16 generated state

on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - run: node scripts/public-release-gate.mjs --refresh-generated
      - run: git status --short
      - uses: actions/upload-artifact@v4
        with:
          name: issue-16-generated-state
          path: |
            .lore/extracted/components.yaml
            .lore/extracted/relationships.yaml
            .lore/extracted/tests.yaml
          if-no-files-found: error
          retention-days: 1

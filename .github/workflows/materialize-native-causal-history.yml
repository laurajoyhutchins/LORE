name: Materialize native causal history

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Restore dependencies
        shell: bash
        run: |
          set -euo pipefail
          node scripts/restore-verified-lockfile.mjs
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Read bounded LORE context
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm lore extract --check
          corepack pnpm lore validate
          corepack pnpm lore context .lore/tasks/native-causal-history-migration.yaml > /tmp/lore-causal-context.yaml
          grep -q 'native-causal-history-migration' /tmp/lore-causal-context.yaml
      - name: Produce ephemeral evidence-backed proposal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          base = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          skill_path = "skills/maintain-repository-documentation/SKILL.md"
          digest = "sha256:" + hashlib.sha256(Path(skill_path).read_bytes()).hexdigest()
          evidence_revision = "febd06c201868fe16c0ffed3866b5cbf92c37abc"
          evidence_path = "docs/superpowers/specs/2026-07-28-lore-design.md"

          def evidence():
              return [{"revision": evidence_revision, "path": evidence_path}]

          def record(kind, ident, title, summary, payload=None):
              return {
                  "schema_version": 1,
                  "id": ident,
                  "kind": kind,
                  "revision": 1,
                  "status": "active",
                  "title": title,
                  "summary": summary,
                  "scope": {"repository": "lore", "components": []},
                  "evidence": evidence(),
                  "disclosure": {
                      "audiences": ["maintainer"],
                      "tags": ["causal-history", kind],
                      "weight": 90,
                  },
                  "provenance": {
                      "source": "proposal",
                      "transaction": None,
                      "producer": "ChatGPT GPT-5.6 Sol",
                  },
                  "supersedes": None,
                  "payload": payload or {},
              }

          def lore_ref(kind, ident):
              return f"lore://lore/{kind}/{ident}@1"

          operations = []
          def append(value):
              operations.append({"operation": "append_record", "record": value})

          append(record(
              "constraint",
              "constraint.durable-repository-knowledge",
              "Durable repository knowledge",
              "Repository knowledge must persist as reviewable, versioned Git state and remain usable by arbitrary maintainers.",
          ))
          append(record(
              "finding",
              "finding.git-history-is-not-semantic-knowledge",
              "Git history is not semantic knowledge",
              "Git provides durable review and reconstruction, but accepted semantic records are still required to preserve architectural interpretation explicitly.",
          ))
          append(record(
              "finding",
              "finding.generated-prose-is-not-authority",
              "Generated prose is not authority",
              "Human-readable Markdown is a generated view and cannot be the authoritative representation of accepted repository meaning.",
          ))
          append(record(
              "decision",
              "decision.repository-local-knowledge-protocol",
              "Repository-local knowledge protocol",
              "LORE stores reviewed semantic knowledge, evidence, transactions, and deterministic views inside the repository under explicit contracts.",
          ))
          append(record(
              "constraint",
              "constraint.separate-facts-meaning-and-views",
              "Separate facts, meaning, and views",
              "Deterministic observations, reviewed semantic meaning, and generated views must remain distinct authority layers.",
          ))
          append(record(
              "finding",
              "finding.collapsed-document-authority-is-insufficient",
              "Collapsed document authority is insufficient",
              "A single prose document cannot safely distinguish replaceable extracted facts from append-only reviewed semantic meaning.",
          ))
          append(record(
              "decision",
              "decision.separate-authority-layers",
              "Separate authority layers",
              "LORE gives extracted facts, semantic records, proposals, transactions, and projections distinct mutation and authority rules.",
          ))

          def edge(ident, source, target, relation, rationale):
              append(record(
                  "relationship",
                  ident,
                  ident.replace("relationship.", "").replace("-", " ").replace(".", " ").title(),
                  rationale,
                  {"from": source, "to": target, "relation": relation, "rationale": rationale},
              ))

          durable = lore_ref("constraint", "constraint.durable-repository-knowledge")
          git_finding = lore_ref("finding", "finding.git-history-is-not-semantic-knowledge")
          prose_finding = lore_ref("finding", "finding.generated-prose-is-not-authority")
          protocol = lore_ref("decision", "decision.repository-local-knowledge-protocol")
          separate_constraint = lore_ref("constraint", "constraint.separate-facts-meaning-and-views")
          collapsed = lore_ref("finding", "finding.collapsed-document-authority-is-insufficient")
          separate = lore_ref("decision", "decision.separate-authority-layers")

          edge("relationship.durability-to-git-history-finding", durable, git_finding, "leads_to", "Requiring durable repository knowledge exposes the need to represent accepted meaning explicitly rather than rely on Git history alone.")
          edge("relationship.durability-to-prose-finding", durable, prose_finding, "leads_to", "Requiring durable repository knowledge exposes generated prose as a view rather than an authority store.")
          edge("relationship.git-history-finding-to-protocol", git_finding, protocol, "leads_to", "The gap between Git history and explicit accepted meaning motivates a repository-local semantic knowledge protocol.")
          edge("relationship.prose-finding-to-protocol", prose_finding, protocol, "leads_to", "Keeping generated prose non-authoritative requires a repository-local semantic knowledge protocol beneath the views.")
          edge("relationship.protocol-enables-lore", protocol, lore_ref("repository", "repository.lore"), "enables", "The repository-local protocol is the accepted design that LORE implements and self-hosts.")
          edge("relationship.protocol-requires-git-storage", protocol, lore_ref("decision", "decision.git-backed-storage"), "requires", "A repository-local accepted-knowledge protocol requires durable versioned storage, review, and reconstruction in Git.")
          edge("relationship.protocol-requires-agent-neutral-contract", protocol, lore_ref("decision", "decision.agent-neutral-maintainer-contract"), "requires", "The protocol must remain usable by arbitrary maintainers, so maintenance is defined by public context and proposal contracts rather than agent identity.")
          edge("relationship.protocol-requires-cli", protocol, lore_ref("component", "component.cli"), "requires", "The repository-local protocol requires an executable public command surface for extraction, validation, context, proposals, transactions, and verification.")
          edge("relationship.protocol-requires-bootstrap", protocol, lore_ref("procedure", "procedure.bootstrap-repository"), "requires", "A repository-local self-describing protocol requires an explicit bootstrap procedure to establish and verify its trust root.")
          edge("relationship.separation-to-collapse-finding", separate_constraint, collapsed, "leads_to", "The requirement to keep facts, reviewed meaning, and generated views distinct rules out a single collapsed document authority model.")
          edge("relationship.collapse-finding-to-layer-decision", collapsed, separate, "leads_to", "The inability of one document layer to preserve distinct authority semantics motivates separate validated layers.")
          edge("relationship.layers-require-extraction", separate, lore_ref("component", "component.extraction"), "requires", "Separate authority layers require a deterministic extraction layer for replaceable repository observations.")
          edge("relationship.layers-require-transactions", separate, lore_ref("component", "component.transactions"), "requires", "Separate authority layers require transactional application so accepted semantic history changes through a validated boundary.")
          edge("relationship.layers-require-validation", separate, lore_ref("component", "component.validation"), "requires", "Separate authority layers require validation of schemas, evidence, records, and repository invariants.")
          edge("relationship.layers-require-no-direct-mutation", separate, lore_ref("constraint", "constraint.no-agent-direct-mutation"), "requires", "Append-only accepted meaning and generated views require maintainers to propose changes rather than mutate accepted history directly.")
          edge("relationship.bootstrap-exposes-hand-authored-kernel", lore_ref("procedure", "procedure.bootstrap-repository"), lore_ref("finding", "finding.bootstrap-kernel-is-hand-authored"), "leads_to", "Self-hosting begins from an explicit hand-authored bootstrap kernel that must be reviewed before generated self-description can be trusted.")

          proposal = {
              "protocol": "lore-proposal/v1",
              "proposal_id": "native-causal-history-migration",
              "base_revision": base,
              "producer": {
                  "type": "llm-maintainer",
                  "name": "ChatGPT GPT-5.6 Sol",
                  "model": "GPT-5.6 Sol",
              },
              "skill": {"path": skill_path, "digest": digest},
              "result": "changes_proposed",
              "operations": operations,
              "uncertainties": [
                  "This transaction captures the two evidence-backed causal arcs and their direct implications for LORE's current accepted records; it does not claim complete archaeology beyond evidence in the approved design specification."
              ],
          }
          Path(".lore/proposals/native-causal-history-migration.yaml").write_text(
              json.dumps(proposal, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Validate and apply through LORE
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm lore validate-proposal .lore/proposals/native-causal-history-migration.yaml
          corepack pnpm lore apply .lore/proposals/native-causal-history-migration.yaml
          rm .lore/proposals/native-causal-history-migration.yaml
          corepack pnpm lore validate
          corepack pnpm lore project --check
          corepack pnpm lore verify-self
      - name: Commit accepted state and remove harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-native-causal-history.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "docs: accept native LORE causal history"
          node scripts/public-release-gate.mjs
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Materialize issue 16 generated state

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 17 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - run: node scripts/public-release-gate.mjs --refresh-generated
      - name: Commit LORE-produced state and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-issue-16-generated.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .lore/extracted/components.yaml .lore/extracted/relationships.yaml .lore/extracted/tests.yaml .github/workflows/materialize-issue-16-generated.yml
          git diff --cached --check
          git commit -m "chore: reconcile issue 16 LORE generated state"
          node scripts/public-release-gate.mjs
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Materialize Deciduous native compatibility

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 24 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Add durable compatibility assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/projection/causal-projections.test.ts')
          text = path.read_text()
          anchor = '  expect(compat).toContain(\'"type": "leads_to"\');\n'
          extra = '''  expect(compat).toContain('"type": "observation"');
          expect(compat).not.toContain('"type": "finding"');
          expect(compat).toContain('"from": "lore.finding.finding.source.r1"');
          expect(compat).toContain('"to": "lore.decision.decision.target.r1"');
          expect(compat).toContain(`"commit:${sha}#docs/design.md"`);
          expect(compat).toContain(`"lore_ref": "${from}"`);
          expect(compat).toContain('"lifecycle_status": "active"');
          expect(compat).toContain('"current": true');
          expect(compat).toContain('"node_types"');
          expect(compat).toContain('"edge_types"');
          '''
          if extra.strip() not in text:
              assert anchor in text
              path.write_text(text.replace(anchor, anchor + extra, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/projection/causal-projections.test.ts
          git diff --cached --check
          git commit -m "test: enforce native Deciduous compatibility mapping"
      - name: Regenerate through LORE and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/public-release-gate.mjs --refresh-generated
          rm .github/workflows/materialize-deciduous-native-compat.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: reconcile Deciduous compatibility projection"
          node scripts/public-release-gate.mjs
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

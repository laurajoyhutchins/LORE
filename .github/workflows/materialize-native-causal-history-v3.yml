name: Materialize native causal history v3

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Restore and establish clean exact base
        shell: bash
        run: |
          set -euo pipefail
          node scripts/restore-verified-lockfile.mjs
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm lore extract
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .lore/extracted
          if ! git diff --cached --quiet; then
            git commit -m "verification: reconcile migration-base extracted facts"
          fi
          test -z "$(git status --short)"
          corepack pnpm lore validate
          corepack pnpm lore context .lore/tasks/native-causal-history-migration.yaml > /tmp/lore-causal-context.yaml
          grep -q 'native-causal-history-migration' /tmp/lore-causal-context.yaml
      - name: Apply ignored ephemeral proposal through LORE
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '.lore/proposals/native-causal-history-migration.yaml' >> .git/info/exclude
          python scripts/build-native-causal-history-proposal.py
          test -z "$(git status --short)"
          corepack pnpm lore validate-proposal .lore/proposals/native-causal-history-migration.yaml
          corepack pnpm lore apply .lore/proposals/native-causal-history-migration.yaml
          rm .lore/proposals/native-causal-history-migration.yaml
      - name: Remove migration machinery and commit accepted state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-native-causal-history.yml
          rm .github/workflows/materialize-native-causal-history-v2.yml
          rm .github/workflows/materialize-native-causal-history-v3.yml
          rm scripts/build-native-causal-history-proposal.py
          corepack pnpm lore extract
          corepack pnpm lore validate
          corepack pnpm lore project --check
          git add -A
          git diff --cached --check
          git commit -m "docs: accept native LORE causal history"
          node scripts/public-release-gate.mjs
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

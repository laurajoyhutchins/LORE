name: Materialize native causal history v4

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - run: |
          bash <(sed \
            -e '/^rm \.lore\/proposals\/native-causal-history-migration.yaml$/a corepack pnpm tsx scripts/refresh-hydration-snapshots.ts' \
            -e '/^rm scripts\/materialize-native-causal-history.sh$/a rm -f scripts/refresh-hydration-snapshots.ts' \
            -e 's/^rm /rm -f /' \
            scripts/materialize-native-causal-history.sh)

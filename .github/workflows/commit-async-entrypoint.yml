name: Commit async CLI entrypoint resolution

on:
  push:
    branches: [feat/versioned-cli-release]
    paths:
      - .github/workflows/commit-async-entrypoint.yml

permissions:
  contents: write

concurrency:
  group: commit-async-entrypoint
  cancel-in-progress: false

jobs:
  commit:
    if: ${{ github.repository == 'laurajoyhutchins/LORE' && github.ref == 'refs/heads/feat/versioned-cli-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: c015d08764019071522d87f4ac905baa4424651e
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/versioned-cli-release
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Verify one-shot authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^1^{commit}')" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "feat/versioned-cli-release"
      - name: Move canonical entrypoint resolution onto the existing dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          metadata = Path('src/release/metadata.ts')
          text = metadata.read_text()
          text = text.replace(
              'import { readFile } from "node:fs/promises";',
              'import { readFile, realpath } from "node:fs/promises";',
          )
          anchor = '''interface PackageIdentity {
            name: string;
            version: string;
          }

          export async function createVersionInfo(): Promise<LoreVersionInfo> {
          '''
          replacement = '''interface PackageIdentity {
            name: string;
            version: string;
          }

          type RealpathResolver = (candidate: string) => string | Promise<string>;

          async function isCliEntryPoint(
            modulePath: string,
            executablePath: string | undefined,
            canonicalizePath: RealpathResolver = realpath,
          ): Promise<boolean> {
            if (executablePath === undefined) return false;
            try {
              return (
                (await canonicalizePath(modulePath)) ===
                (await canonicalizePath(executablePath))
              );
            } catch {
              return false;
            }
          }

          export { isCliEntryPoint };

          export async function createVersionInfo(): Promise<LoreVersionInfo> {
          '''
          if text.count(anchor) != 1:
              raise SystemExit('METADATA_PATCH_ANCHOR_INVALID')
          metadata.write_text(text.replace(anchor, replacement))

          main = Path('src/cli/main.ts')
          text = main.read_text()
          replacements = [
              ('import { realpathSync } from "node:fs";\n', ''),
              ('import { fileURLToPath, pathToFileURL } from "node:url";', 'import { fileURLToPath } from "node:url";'),
              ('import { createVersionInfo } from "../release/metadata.js";', 'import { createVersionInfo, isCliEntryPoint } from "../release/metadata.js";'),
          ]
          for before, after in replacements:
              if text.count(before) != 1:
                  raise SystemExit(f'MAIN_IMPORT_PATCH_ANCHOR_INVALID: {before}')
              text = text.replace(before, after)
          function_block = '''export function isCliEntryPoint(
            moduleUrl: string,
            executablePath: string | undefined,
            canonicalizePath: (candidate: string) => string = realpathSync,
          ): boolean {
            if (executablePath === undefined) return false;
            const modulePath = fileURLToPath(moduleUrl);
            try {
              return canonicalizePath(modulePath) === canonicalizePath(executablePath);
            } catch {
              return moduleUrl === pathToFileURL(executablePath).href;
            }
          }

          '''
          if text.count(function_block) != 1:
              raise SystemExit('MAIN_FUNCTION_PATCH_ANCHOR_INVALID')
          text = text.replace(function_block, '')
          export_anchor = 'export interface CliIo {'
          if text.count(export_anchor) != 1:
              raise SystemExit('MAIN_EXPORT_PATCH_ANCHOR_INVALID')
          text = text.replace(
              export_anchor,
              'export { isCliEntryPoint } from "../release/metadata.js";\n\nexport interface CliIo {',
          )
          bottom = '''if (isCliEntryPoint(import.meta.url, process.argv[1])) {
            process.exitCode = await runCli(process.argv.slice(2));
          }'''
          replacement_bottom = '''if (
            await isCliEntryPoint(fileURLToPath(import.meta.url), process.argv[1])
          ) {
            process.exitCode = await runCli(process.argv.slice(2));
          }'''
          if text.count(bottom) != 1:
              raise SystemExit('MAIN_BOTTOM_PATCH_ANCHOR_INVALID')
          main.write_text(text.replace(bottom, replacement_bottom))

          test = Path('tests/unit/cli/main.test.ts')
          text = test.read_text()
          text = text.replace('import { pathToFileURL } from "node:url";\n', '')
          first = '''it("detects the executable entrypoint through a platform-safe file URL", () => {
            const executablePath = path.resolve("dist/cli/main.js");
            const moduleUrl = pathToFileURL(executablePath).href;
            expect(isCliEntryPoint(moduleUrl, executablePath)).toBe(true);
            expect(isCliEntryPoint(moduleUrl, undefined)).toBe(false);
            expect(isCliEntryPoint(moduleUrl, path.resolve("dist/cli/other.js"))).toBe(
              false,
            );
          });'''
          first_replacement = '''it("detects the executable entrypoint through a platform-safe path", async () => {
            const executablePath = path.resolve("dist/cli/main.js");
            const canonicalize = async (candidate: string) => candidate;
            await expect(
              isCliEntryPoint(executablePath, executablePath, canonicalize),
            ).resolves.toBe(true);
            await expect(
              isCliEntryPoint(executablePath, undefined, canonicalize),
            ).resolves.toBe(false);
            await expect(
              isCliEntryPoint(
                executablePath,
                path.resolve("dist/cli/other.js"),
                canonicalize,
              ),
            ).resolves.toBe(false);
          });'''
          if text.count(first) != 1:
              raise SystemExit('TEST_FIRST_PATCH_ANCHOR_INVALID')
          text = text.replace(first, first_replacement)
          second = '''it("detects a package entrypoint invoked through a bin symlink", () => {
            const modulePath = path.resolve(
              "node_modules/@laurajoyhutchins/lore/dist/cli/main.js",
            );
            const executablePath = path.resolve("node_modules/.bin/lore");
            const canonicalize = vi.fn((candidate: string) =>
              candidate === executablePath ? modulePath : candidate,
            );

            expect(
              isCliEntryPoint(pathToFileURL(modulePath).href, executablePath, canonicalize),
            ).toBe(true);
            expect(canonicalize).toHaveBeenCalledWith(modulePath);
            expect(canonicalize).toHaveBeenCalledWith(executablePath);
          });'''
          second_replacement = '''it("detects a package entrypoint invoked through a bin symlink", async () => {
            const modulePath = path.resolve(
              "node_modules/@laurajoyhutchins/lore/dist/cli/main.js",
            );
            const executablePath = path.resolve("node_modules/.bin/lore");
            const canonicalize = vi.fn((candidate: string) =>
              candidate === executablePath ? modulePath : candidate,
            );

            await expect(
              isCliEntryPoint(modulePath, executablePath, canonicalize),
            ).resolves.toBe(true);
            expect(canonicalize).toHaveBeenCalledWith(modulePath);
            expect(canonicalize).toHaveBeenCalledWith(executablePath);
          });'''
          if text.count(second) != 1:
              raise SystemExit('TEST_SECOND_PATCH_ANCHOR_INVALID')
          test.write_text(text.replace(second, second_replacement))
          PY
      - name: Verify source and unchanged extraction graph
        shell: bash
        run: |
          set -euo pipefail
          node scripts/restore-verified-lockfile.mjs
          corepack pnpm install --frozen-lockfile
          corepack pnpm typecheck
          corepack pnpm lint
          corepack pnpm test
          corepack pnpm build
          corepack pnpm lore extract --check
          rm pnpm-lock.yaml
      - name: Commit only the entrypoint source and regression
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/commit-async-entrypoint.yml
          git diff --check
          git add src/release/metadata.ts src/cli/main.ts tests/unit/cli/main.test.ts
          ACTUAL="$(git status --short | sed 's/^...//' | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/commit-async-entrypoint.yml' \
            'src/cli/main.ts' \
            'src/release/metadata.ts' \
            'tests/unit/cli/main.test.ts' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve installed CLI entrypoint asynchronously'
          git push origin HEAD:feat/versioned-cli-release

name: Diagnose release branch sync

on:
  push:
    branches: [feat/versioned-cli-release]
    paths:
      - .github/workflows/diagnose-release-sync.yml

permissions:
  contents: read

concurrency:
  group: diagnose-release-sync
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/versioned-cli-release
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect merge with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          echo "MERGE_EXIT=$status"
          echo "UNMERGED_BEGIN"
          git diff --name-only --diff-filter=U || true
          echo "UNMERGED_END"
          echo "STATUS_BEGIN"
          git status --short
          echo "STATUS_END"
          git merge --abort >/dev/null 2>&1 || true
